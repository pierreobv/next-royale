html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { background: var(--char); color: var(--ink); overflow: hidden; touch-action: none;

#canvas:focus { outline: none; }

#fill { width: 0%; height: 100%; background: var(--gold); border-radius: 6px; transition: width 0.2s; }
#msg { color: var(--grey); font-size: 14px; min-height: 20px; max-width: 520px; line-height: 1.45; }
#notice { display: none; max-width: 520px; background: #2f2f33; border: 1px solid var(--line); border-radius: 12px;
  padding: 18px 20px; color: var(--ink); font-size: 15px; line-height: 1.5; }
#notice button { margin-top: 12px; background: var(--gold); color: var(--char); border: 0; border-radius: 8px;
  font: inherit; font-weight: 700; padding: 10px 18px; cursor: pointer; }
#logo { position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); width: 132px; opacity: 0.9; }
